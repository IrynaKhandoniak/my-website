<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>HabitFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --primary:#1a73e8;
    --primary-light:#e8f0fe;
    --bg:#ffffff;
    --bg2:#f8f9fa;
    --border:rgba(0,0,0,0.1);
    --text:#202124;
    --text2:#5f6368;
    --text3:#9aa0a6;
    --radius:12px;
  }
  [data-theme="dark"]{
    --bg:#1e1e2e;
    --bg2:#2a2a3e;
    --border:rgba(255,255,255,0.1);
    --text:#e8eaed;
    --text2:#9aa0a6;
    --text3:#5f6368;
    --primary-light:#1a3a6e;
  }
  body{font-family:"Poppins",system-ui,sans-serif;background:var(--bg2);color:var(--text);min-height:100vh}
  .app{max-width:680px;margin:0 auto;background:var(--bg);min-height:100vh;border-left:0.5px solid var(--border);border-right:0.5px solid var(--border)}
  .header{padding:16px 20px 0}
  .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .app-title{font-size:18px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:6px}
  .app-title i{color:var(--primary);font-size:20px}
  .header-actions{display:flex;gap:8px}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--text2);padding:4px;border-radius:6px;display:flex;align-items:center;font-size:20px}
  .icon-btn:hover{background:var(--bg2);color:var(--text)}
  .week-strip{display:flex;gap:4px;margin-bottom:16px}
  .day-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:10px;cursor:default}
  .day-col.today{background:var(--primary-light)}
  .day-name{font-size:11px;color:var(--text2);font-weight:500;text-transform:uppercase;letter-spacing:0.05em}
  .day-col.today .day-name{color:var(--primary)}
  .day-num{font-size:15px;font-weight:500;color:var(--text)}
  .day-col.today .day-num{color:var(--primary);font-weight:700}
  .day-dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center}
  .day-dot.done{background:var(--primary);border-color:var(--primary)}
  .day-dot.partial{border-color:var(--primary)}
  .day-dot svg{display:none}
  .day-dot.done svg{display:block}
  .progress-bar{height:2px;background:var(--border);margin:0 20px}
  .progress-fill{height:100%;background:var(--primary);border-radius:2px;transition:width 0.3s}
  .filter-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:0.5px solid var(--border)}
  .filter-label{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:6px}
  .add-btn{background:none;border:none;cursor:pointer;color:var(--primary);font-size:13px;font-weight:500;display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:6px;font-family:inherit}
  .add-btn:hover{background:var(--bg2)}
  .habit-list{padding:8px 12px;display:flex;flex-direction:column;gap:4px}
  .habit-row{display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:10px;cursor:pointer;transition:background 0.12s}
  .habit-row:hover{background:var(--bg2)}
  .habit-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .habit-info{flex:1;min-width:0}
  .habit-name{font-size:15px;color:var(--text);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .habit-name.done-text{color:var(--text3);text-decoration:line-through}
  .habit-meta{display:flex;gap:10px;margin-top:2px}
  .meta-chip{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:3px}
  .meta-chip.streak{color:#e8720c}
  .check-circle{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s;background:none;cursor:pointer}
  .check-circle.checked{background:var(--primary);border-color:var(--primary)}
  .check-circle:hover{border-color:var(--primary)}
  .empty{text-align:center;padding:48px 20px;color:var(--text2);font-size:14px;line-height:2}
  .stats-row{display:flex;gap:10px;padding:12px 20px 20px;border-top:0.5px solid var(--border)}
  .stat-card{flex:1;background:var(--bg2);border-radius:10px;padding:10px;text-align:center}
  .stat-num{font-size:20px;font-weight:500;color:var(--text)}
  .stat-lbl{font-size:11px;color:var(--text2);margin-top:2px}
  /* Modal */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal-bg.open{display:flex}
  .modal{background:var(--bg);border-radius:var(--radius);width:min(420px,100%);border:0.5px solid var(--border)}
  .modal-header{padding:16px 20px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .modal-header h3{font-size:16px;font-weight:500;color:var(--text)}
  .modal-body{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
  .field-label{font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:500}
  .field-input{width:100%;font-size:14px;padding:8px 10px;border-radius:8px;border:0.5px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit}
  .field-input:focus{outline:2px solid var(--primary);outline-offset:-1px}
  .emoji-grid{display:flex;flex-wrap:wrap;gap:6px}
  .emoji-opt{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border:1.5px solid transparent;background:var(--bg2)}
  .emoji-opt.sel{border-color:var(--primary);background:var(--primary-light)}
  .color-row{display:flex;gap:8px;flex-wrap:wrap}
  .color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent}
  .color-swatch.sel{border-color:var(--text)}
  .modal-footer{padding:12px 20px;border-top:0.5px solid var(--border);display:flex;justify-content:flex-end;gap:8px;align-items:center}
  .btn-cancel{background:none;border:0.5px solid var(--border);color:var(--text2);font-size:14px;padding:7px 16px;border-radius:8px;cursor:pointer;font-family:inherit}
  .btn-save{background:var(--primary);border:none;color:#fff;font-size:14px;font-weight:500;padding:7px 20px;border-radius:8px;cursor:pointer;font-family:inherit}
  .btn-save:hover{background:#1557b0}
  .delete-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;padding:4px 8px;border-radius:6px;margin-right:auto;font-family:inherit;display:flex;align-items:center;gap:4px}
  .delete-btn:hover{color:#d93025;background:#fce8e6}
  @media(max-width:480px){.stats-row{flex-wrap:wrap}.stat-card{min-width:calc(50% - 5px)}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div class="app-title">
        <i class="ti ti-check"></i>
        Habits
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="openModal()" title="Add habit" aria-label="Add habit"><i class="ti ti-plus"></i></button>
        <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"><i class="ti ti-moon"></i></button>
      </div>
    </div>
    <div class="week-strip" id="weekStrip"></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="filter-bar">
    <div class="filter-label">
      <i class="ti ti-calendar" style="font-size:15px"></i>
      <span id="todayLabel"></span>
    </div>
    <button class="add-btn" onclick="openModal()"><i class="ti ti-plus" style="font-size:15px"></i> Add habit</button>
  </div>
  <div class="habit-list" id="habitList"></div>
  <div class="stats-row" id="statsRow"></div>
</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">New habit</h3>
      <button class="icon-btn" onclick="closeModal()" aria-label="Close"><i class="ti ti-x" style="font-size:18px"></i></button>
    </div>
    <div class="modal-body">
      <div>
        <div class="field-label">Name</div>
        <input class="field-input" id="habitName" type="text" placeholder="e.g. Cold Shower"/>
      </div>
      <div>
        <div class="field-label">Icon</div>
        <div class="emoji-grid" id="emojiGrid"></div>
      </div>
      <div>
        <div class="field-label">Color</div>
        <div class="color-row" id="colorRow"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="delete-btn" id="deleteBtn" onclick="deleteHabit()" style="display:none"><i class="ti ti-trash" style="font-size:14px"></i> Delete</button>
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveHabit()">Save</button>
    </div>
  </div>
</div>

<script>
const EMOJIS=['💊','🥕','🌙','🧘','🚿','☕','📖','🏃','💧','🍎','🏋️','🎯','✍️','🎵','🌿','⭐'];
const COLORS=['#4caf80','#e8720c','#7b61ff','#1a73e8','#e91e63','#f4b400','#00bcd4','#ff5722','#9c27b0','#3f51b5'];
const KEY='hflow2';
let state=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{habits:[]};}catch(e){return{habits:[]};} })();
let editing=null,selEmoji=EMOJIS[0],selColor=COLORS[0];

function todayStr(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function currentStreak(log){let s=0;for(let i=0;;i++){const d=new Date();d.setDate(d.getDate()-i);if(log[todayStr(d)])s++;else break;}return s;}
function totalDone(log){return Object.values(log).filter(Boolean).length;}

function buildWeek(){
  const strip=document.getElementById('weekStrip');strip.innerHTML='';
  const today=new Date();const names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  for(let i=6;i>=0;i--){
    const d=new Date(today);d.setDate(today.getDate()-i);const key=todayStr(d);const isToday=i===0;
    const done=state.habits.length>0&&state.habits.filter(h=>h.log&&h.log[key]).length===state.habits.length;
    const partial=!done&&state.habits.some(h=>h.log&&h.log[key]);
    const col=document.createElement('div');col.className='day-col'+(isToday?' today':'');
    col.innerHTML=`<span class="day-name">${names[d.getDay()]}</span><span class="day-num">${d.getDate()}</span>
      <div class="day-dot${done?' done':partial?' partial':''}">
        <svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4l3 3 5-6" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>`;
    strip.appendChild(col);
  }
}

function render(){
  buildWeek();
  const today=todayStr();const list=document.getElementById('habitList');list.innerHTML='';
  const habits=state.habits;
  if(!habits.length){list.innerHTML='<div class="empty">No habits yet.<br>Tap <b>+ Add habit</b> to get started.</div>';}
  let doneCount=0;
  habits.forEach(h=>{
    const isDone=!!(h.log&&h.log[today]);if(isDone)doneCount++;
    const streak=currentStreak(h.log||{});const total=totalDone(h.log||{});
    const row=document.createElement('div');row.className='habit-row';
    row.innerHTML=`
      <div class="habit-icon" style="background:${h.color}22">${h.emoji}</div>
      <div class="habit-info">
        <div class="habit-name${isDone?' done-text':''}">${h.name}</div>
        <div class="habit-meta">
          <span class="meta-chip streak"><i class="ti ti-bolt" style="font-size:12px"></i> ${streak} ${streak===1?'day':'days'}</span>
          <span class="meta-chip"><i class="ti ti-flame" style="font-size:12px"></i> ${total} total</span>
        </div>
      </div>
      <button class="check-circle${isDone?' checked':''}" aria-label="${isDone?'Uncheck':'Check'} ${h.name}" data-id="${h.id}">
        ${isDone?`<svg width="12" height="10" viewBox="0 0 12 10" fill="none"><path d="M1 5l4 4L11 1" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`:''}
      </button>`;
    row.querySelector('.check-circle').addEventListener('click',(e)=>{e.stopPropagation();toggle(h.id);});
    row.querySelector('.habit-info').addEventListener('click',()=>openModal(h));
    row.querySelector('.habit-icon').addEventListener('click',()=>openModal(h));
    list.appendChild(row);
  });
  const pct=habits.length?Math.round(doneCount/habits.length*100):0;
  document.getElementById('progressFill').style.width=pct+'%';
  const best=habits.length?Math.max(...habits.map(h=>currentStreak(h.log||{}))):0;
  document.getElementById('statsRow').innerHTML=`
    <div class="stat-card"><div class="stat-num">${habits.length}</div><div class="stat-lbl">Total</div></div>
    <div class="stat-card"><div class="stat-num">${doneCount}/${habits.length}</div><div class="stat-lbl">Today</div></div>
    <div class="stat-card"><div class="stat-num">${pct}%</div><div class="stat-lbl">Done</div></div>
    <div class="stat-card"><div class="stat-num">${best}</div><div class="stat-lbl">Best streak</div></div>`;
  const d=new Date();
  document.getElementById('todayLabel').textContent=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
}

function toggle(id){const h=state.habits.find(x=>x.id===id);if(!h)return;if(!h.log)h.log={};const k=todayStr();h.log[k]=!h.log[k];save();render();}

function buildEmojiGrid(){const g=document.getElementById('emojiGrid');g.innerHTML='';EMOJIS.forEach(e=>{const el=document.createElement('div');el.className='emoji-opt'+(e===selEmoji?' sel':'');el.textContent=e;el.onclick=()=>{selEmoji=e;buildEmojiGrid();};g.appendChild(el);});}
function buildColors(){const r=document.getElementById('colorRow');r.innerHTML='';COLORS.forEach(c=>{const el=document.createElement('div');el.className='color-swatch'+(c===selColor?' sel':'');el.style.background=c;el.onclick=()=>{selColor=c;buildColors();};r.appendChild(el);});}

function openModal(habit=null){editing=habit;selEmoji=habit?habit.emoji:EMOJIS[0];selColor=habit?habit.color:COLORS[0];document.getElementById('modalTitle').textContent=habit?'Edit habit':'New habit';document.getElementById('habitName').value=habit?habit.name:'';document.getElementById('deleteBtn').style.display=habit?'':'none';buildEmojiGrid();buildColors();document.getElementById('modalBg').classList.add('open');setTimeout(()=>document.getElementById('habitName').focus(),50);}
function closeModal(){document.getElementById('modalBg').classList.remove('open');editing=null;}
function saveHabit(){const name=document.getElementById('habitName').value.trim();if(!name)return;if(editing){editing.name=name;editing.emoji=selEmoji;editing.color=selColor;}else{state.habits.push({id:crypto.randomUUID(),name,emoji:selEmoji,color:selColor,log:{},createdAt:Date.now()});}save();render();closeModal();}
function deleteHabit(){if(!editing)return;if(!confirm(`Delete "${editing.name}"?`))return;state.habits=state.habits.filter(h=>h.id!==editing.id);save();render();closeModal();}

document.getElementById('modalBg').addEventListener('click',(e)=>{if(e.target===document.getElementById('modalBg'))closeModal();});
document.getElementById('habitName').addEventListener('keydown',(e)=>{if(e.key==='Enter')saveHabit();});

// Theme toggle
const themeBtn=document.getElementById('themeBtn');
const savedTheme=localStorage.getItem('hflow_theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
document.documentElement.setAttribute('data-theme',savedTheme);
themeBtn.querySelector('i').className='ti ti-'+(savedTheme==='dark'?'sun':'moon');
themeBtn.addEventListener('click',()=>{const isDark=document.documentElement.getAttribute('data-theme')==='dark';const next=isDark?'light':'dark';document.documentElement.setAttribute('data-theme',next);localStorage.setItem('hflow_theme',next);themeBtn.querySelector('i').className='ti ti-'+(next==='dark'?'sun':'moon');});

render();
</script>
</body>
</html>
